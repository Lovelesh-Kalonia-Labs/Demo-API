name: MuleSoft Release Creation

on:
  push:
    branches:
      - master # For legacy repos
      - main

permissions:
  contents: write

jobs:
  release-creation:
    runs-on: ubuntu-latest
    
    environment: ${{ 'PRODUCTION' }}
    
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17

      - name: Convert Snapshot to Release
        run: |
          mvn versions:set \
            -DremoveSnapshot=true \
            -DgenerateBackupPoms=false

      - name: Install XML Tools
        run: sudo apt-get install -y libxml2-utils

      - name: Read Release Version
        id: releaseVersion
        shell: bash
        run: |
          VERSION=$(xmllint --xpath "/*[local-name()='project']/*[local-name()='version']/text()" pom.xml)

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Release Version : $VERSION"

      - name: Publish Mule App (Release) Artifact to Exchange
        run: |
          echo "Publishing Mule App as a Release Artifact to Exchange..."

          mvn clean deploy \
            -DskipTests \
            -s settings.xml \
            -DconnectedAppClientId="${{ secrets.CONNECTED_APP_ID }}" \
            -DconnectedAppClientSecret="${{ secrets.CONNECTED_APP_SECRET }}"

          echo "Mule App (Release) Artifact published successfully"
      
      - name: Create Git Tag
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Increment to Next Snapshot
        run: |
          VERSION=$(xmllint --xpath "/*[local-name()='project']/*[local-name()='version']/text()" pom.xml)

          VERSION=${VERSION%-SNAPSHOT}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          PATCH=$((PATCH + 1))

          NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}-SNAPSHOT"

          mvn versions:set \
              -DnewVersion="$NEXT_VERSION" \
              -DgenerateBackupPoms=false

      - name: Commit Next Snapshot
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add pom.xml

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Prepare next development iteration"
          git push
