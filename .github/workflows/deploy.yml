name: MuleSoft Deployment

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'PRODUCTION' || 'SANDBOX' }}
    
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Install XML Tools
        run: sudo apt-get install -y libxml2-utils

      - name: Install CLI
        run: npm install -g anypoint-cli-v4-public

      - name: Select Anypoint Platform Configuration
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "ENVIRONMENT=PRODUCTION" >> $GITHUB_ENV
            echo "CONFIG_FILE=anypoint-info/PRODUCTION.json" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=SANDBOX" >> $GITHUB_ENV
            echo "CONFIG_FILE=anypoint-info/SANDBOX.json" >> $GITHUB_ENV
          fi

      - name: Display Selected Anypoint Platform Configuration
        run: |
          echo "Environment: $ENVIRONMENT"
          echo "Config File: $CONFIG_FILE"

      - name: CLI Login Check
        run: |
          anypoint-cli-v4 account:environment:list \
            --client_id "${{ secrets.CONNECTED_APP_ID }}" \
            --client_secret "${{ secrets.CONNECTED_APP_SECRET }}" \
            --output json > environments.json

          # cat environments.json # To print the output
          echo "Status: OK"

      - name: Create/Update API Manager Instance
        run: |

          echo "Reading $CONFIG_FILE..."

          # Extract assetId from configuration file
          ASSET_ID=$(jq -r '.exchangeAssetId //empty' "$CONFIG_FILE")

          if [ -z "$ASSET_ID" ]; then
          
            echo "exchangeAssetId not found in $CONFIG_FILE"
            echo "Skipping API Manager Instance creation/update"
            
            echo "API_MANAGER_ENABLED=false" >> $GITHUB_ENV
            exit 0
          
          fi

          echo "Asset ID: $ASSET_ID"
          echo "Reading pom.xml..."

          # Extract asset version from pom.xml file using assetId
          ASSET_VERSION=$(xmllint --xpath "/*[local-name()='project']/*[local-name()='dependencies']/*[local-name()='dependency'][*[local-name()='artifactId']='$ASSET_ID' and *[local-name()='classifier']='raml']/*[local-name()='version']/text()" pom.xml 2>/dev/null || true)
          
          if [ -z "$ASSET_VERSION" ]; then

            echo "RAML dependency not found in pom.xml"
            echo "Skipping API Manager Instance creation/update."

            echo "API_MANAGER_ENABLED=false" >> $GITHUB_ENV
            exit 0

          fi
          
          echo "Asset Version: $ASSET_VERSION"
          MAJOR_VERSION=$(echo "$ASSET_VERSION" | cut -d. -f1)
          API_VERSION="v${MAJOR_VERSION}"
          echo "API Version: $API_VERSION"

          MULE_PROJECT_ARTIFACT_ID=$(xmllint --xpath "/*[local-name()='project']/*[local-name()='artifactId']/text()" pom.xml)
          echo "Mule Project Artifact ID: $MULE_PROJECT_ARTIFACT_ID"

          echo "Building instance label for API Manager..."

          INSTANCE_LABEL="${ENVIRONMENT}-${MULE_PROJECT_ARTIFACT_ID}-${API_VERSION}"
          echo "Instance Label: $INSTANCE_LABEL"

          echo "Looking for existing API instances..."

          anypoint-cli-v4 api-mgr:api:list \
            --environment "$ENVIRONMENT" \
            --instanceLabel "$INSTANCE_LABEL" \
            --client_id "${{ secrets.CONNECTED_APP_ID }}" \
            --client_secret "${{ secrets.CONNECTED_APP_SECRET }}" \
            --output json > apis.json

          # cat apis.json # To print the output

          # Below command will only grab the id of the first one it finds. (It is possible for multiple instances to exist with the same label)
          API_INSTANCE_ID=$(jq -r --arg asset "$ASSET_ID" '.[] | select(.assetId==$asset) | .id' apis.json | head -1) 

          if [ -z "$API_INSTANCE_ID" ] || [ "$API_INSTANCE_ID" = "null" ]; then

            echo "Not found"
            echo "Creating new API Manager Instance..."

            anypoint-cli-v4 api-mgr:api:manage \
              "$ASSET_ID" \
              "$ASSET_VERSION" \
              --environment "$ENVIRONMENT" \
              --client_id "${{ secrets.CONNECTED_APP_ID }}" \
              --client_secret "${{ secrets.CONNECTED_APP_SECRET }}" \
              --muleVersion4OrAbove \
              --apiInstanceLabel "$INSTANCE_LABEL" \
              --output json > apicreate.json

            # cat apicreate.json # To print the output
          
            sleep 3

            anypoint-cli-v4 api-mgr:api:list \
              --environment "$ENVIRONMENT" \
              --instanceLabel "$INSTANCE_LABEL" \
              --client_id "${{ secrets.CONNECTED_APP_ID }}" \
              --client_secret "${{ secrets.CONNECTED_APP_SECRET }}" \
              --output json > apis.json

            # cat apis.json # To print the output

            API_INSTANCE_ID=$(jq -r --arg asset "$ASSET_ID" '.[] | select(.assetId==$asset) | .id' apis.json | head -1)
            echo "Autodiscovery ID: $API_INSTANCE_ID"

          else

            echo "Found Autodiscovery ID: $API_INSTANCE_ID"
            echo "Updating RAML Specification Version..."

            anypoint-cli-v4 api-mgr:api:change-specification \
              "$API_INSTANCE_ID" \
              "$ASSET_VERSION" \
              --environment "$ENVIRONMENT" \
              --client_id "${{ secrets.CONNECTED_APP_ID }}" \
              --client_secret "${{ secrets.CONNECTED_APP_SECRET }}" \
              --output json > apiramlupdate.json

            # cat apiramlupdate.json # To print the output

            echo "Asset Version updated to $ASSET_VERSION"
          
          fi

          echo "API_INSTANCE_ID=$API_INSTANCE_ID" >> $GITHUB_ENV
          echo "API_MANAGER_ENABLED=true" >> $GITHUB_ENV

      - name: Apply Policies
        if: env.API_MANAGER_ENABLED == 'true'
        run: |
          anypoint-cli-v4 api-mgr:policy:list \
            "$API_INSTANCE_ID" \
            --environment "$ENVIRONMENT" \
            --client_id "${{ secrets.CONNECTED_APP_ID }}" \
            --client_secret "${{ secrets.CONNECTED_APP_SECRET }}" \
            --output json > policystate.json
          
          echo "List of policies applied to API instance $API_INSTANCE_ID:"
          cat policystate.json # To print the output

          jq -c '.policies[]' "$CONFIG_FILE" | while read -r policy

          do

            POLICY_NAME=$(echo "$policy" | jq -r '.name')

            echo "Processing policy: $POLICY_NAME"

            POLICY_EXISTS=$(jq -r --arg policy "$POLICY_NAME" '.[] | select(.policyTemplateId==$policy) | .id' policystate.json)

            if [ -z "$POLICY_EXISTS" ]; then

              anypoint-cli-v4 api-mgr:policy:apply \
                "$API_INSTANCE_ID" \
                "$POLICY_NAME" \
                --environment "$ENVIRONMENT" \
                --client_id "${{ secrets.CONNECTED_APP_ID }}" \
                --client_secret "${{ secrets.CONNECTED_APP_SECRET }}" \
            
            else

              echo "Policy $POLICY_NAME already exists on API instance."
            
            fi

          done

      - name: Create SLA Tier
        if: env.API_MANAGER_ENABLED == 'true'
        run: bash scripts/sla.sh

      - name: Deploy CloudHub 2.0
        run: |
          APP_NAME=$(bash -c '
            source scripts/common.sh
            generate_app_name
          ')

          REPLICAS=$(jq -r '.deployment.replicas' "$CONFIG_FILE")
          VCORES=$(jq -r '.deployment.vCores' "$CONFIG_FILE")
          TARGET=$(jq -r '.deployment.target' "$CONFIG_FILE")
          PUBLIC_URL=$(jq -r '.deployment.publicUrl' "$CONFIG_FILE")

          mvn clean deploy -DmuleDeploy \
            -DenvName=$ENVIRONMENT \
            -DapplicationName=$APP_NAME \
            -Dreplicas=$REPLICAS \
            -DvCores=$VCORES \
            -Dtarget=$TARGET \
            -DpublicUrl=$PUBLIC_URL \
            -DapiId=$API_INSTANCE_ID \
            -DconnectedAppClientId=${{ secrets.CONNECTED_APP_ID }} \
            -DconnectedAppClientSecret=${{ secrets.CONNECTED_APP_SECRET }}