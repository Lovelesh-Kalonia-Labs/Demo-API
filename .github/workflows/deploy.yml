name: MuleSoft Deployment

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'PRODUCTION' || 'SANDBOX' }}
    
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Install XML Tools
        run: sudo apt-get install -y libxml2-utils

      - name: Install CLI
        run: npm install -g anypoint-cli-v4-public

      - name: Configure Anypoint Platform Environment
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "ENVIRONMENT=PRODUCTION" >> $GITHUB_ENV
            echo "CONFIG_FILE=anypoint-info/PRODUCTION.json" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=SANDBOX" >> $GITHUB_ENV
            echo "CONFIG_FILE=anypoint-info/SANDBOX.json" >> $GITHUB_ENV
          fi

      - name: Display Selected Anypoint Platform Environment
        run: |
          echo "Environment: $ENVIRONMENT"
          echo "Config File: $CONFIG_FILE"

      - name: CLI Login Check
        run: |
          anypoint-cli-v4 account:environment:list \
            --client_id "${{ secrets.CONNECTED_APP_ID }}" \
            --client_secret "${{ secrets.CONNECTED_APP_SECRET }}"

      - name: Reuse/Create API Manager Instance
        run: |

          echo "Reading configuration..."

          ASSET_ID=$(jq -r '.exchangeApi.assetId' "$CONFIG_FILE")
          ASSET_VERSION=$(jq -r '.exchangeApi.version' "$CONFIG_FILE")
          API_VERSION=$(jq -r '.exchangeApi.apiVersion' "$CONFIG_FILE")

          echo "ASSET_ID=$ASSET_ID"
          echo "ASSET_VERSION=$ASSET_VERSION"
          echo "API_VERSION=$API_VERSION"

          MULE_PROJECT_ARTIFACT_ID=$(xmllint --xpath "/*[local-name()='project']/*[local-name()='artifactId']/text()" pom.xml)
          MULE_PROJECT_VERSION=$(xmllint --xpath "/*[local-name()='project']/*[local-name()='version']/text()" pom.xml)

          echo "MULE_PROJECT_ARTIFACT_ID=$MULE_PROJECT_ARTIFACT_ID"
          echo "MULE_PROJECT_VERSION=$MULE_PROJECT_VERSION"

          INSTANCE_LABEL="${ENVIRONMENT}-${MULE_PROJECT_ARTIFACT_ID}-${API_VERSION}"

          echo "INSTANCE_LABEL=$INSTANCE_LABEL"

          echo "Searching for existing API instances..."

          anypoint-cli-v4 api-mgr:api:list \
            --environment "$ENVIRONMENT" \
            --instanceLabel "$INSTANCE_LABEL" \
            --client_id "${{ secrets.CONNECTED_APP_ID }}" \
            --client_secret "${{ secrets.CONNECTED_APP_SECRET }}" \
            --output json > apis.json

          # cat apis.json # To print the output

          # Below command will only grab the id of the first one it finds. (It is possible for multiple instances to exist with the same label)
          API_INSTANCE_ID=$(jq -r --arg asset "$ASSET_ID" '.[] | select(.assetId==$asset) | .id' apis.json | head -1) 

          if [ -z "$API_INSTANCE_ID" ] || [ "$API_INSTANCE_ID" = "null" ]; then

          echo "Not found. Creating new API Manager Instance..."

          anypoint-cli-v4 api-mgr:api:manage \
            "$ASSET_ID" \
            "$ASSET_VERSION" \
            --environment "$ENVIRONMENT" \
            --client_id "${{ secrets.CONNECTED_APP_ID }}" \
            --client_secret "${{ secrets.CONNECTED_APP_SECRET }}" \
            --muleVersion4OrAbove \
            --apiInstanceLabel "$INSTANCE_LABEL" \
            --output json > apisnew.json

          cat apisnew.json
        
          sleep 1

          anypoint-cli-v4 api-mgr:api:list \
            --environment "$ENVIRONMENT" \
            --instanceLabel "$INSTANCE_LABEL" \
            --client_id "${{ secrets.CONNECTED_APP_ID }}" \
            --client_secret "${{ secrets.CONNECTED_APP_SECRET }}" \
            --output json > apis.json

          API_INSTANCE_ID=$(jq -r --arg asset "$ASSET_ID" '.[] | select(.assetId==$asset) | .id' apis.json | head -1)

          else
          
          echo "Existing API Manager Instance found with ID: $API_INSTANCE_ID"
          
          fi
          echo "API_INSTANCE_ID=$API_INSTANCE_ID"
          echo "API_INSTANCE_ID=$API_INSTANCE_ID" >> $GITHUB_ENV

      - name: Apply Policies
        run: bash scripts/policies.sh

      - name: Create SLA Tier
        run: bash scripts/sla.sh

      - name: Deploy CloudHub 2.0
        run: |
          APP_NAME=$(bash -c '
            source scripts/common.sh
            generate_app_name
          ')

          REPLICAS=$(jq -r '.deployment.replicas' "$CONFIG_FILE")
          VCORES=$(jq -r '.deployment.vCores' "$CONFIG_FILE")
          TARGET=$(jq -r '.deployment.target' "$CONFIG_FILE")
          PUBLIC_URL=$(jq -r '.deployment.publicUrl' "$CONFIG_FILE")

          mvn clean deploy -DmuleDeploy \
            -DenvName=$ENVIRONMENT \
            -DapplicationName=$APP_NAME \
            -Dreplicas=$REPLICAS \
            -DvCores=$VCORES \
            -Dtarget=$TARGET \
            -DpublicUrl=$PUBLIC_URL \
            -DapiId=$API_INSTANCE_ID \
            -DconnectedAppClientId=${{ secrets.CONNECTED_APP_ID }} \
            -DconnectedAppClientSecret=${{ secrets.CONNECTED_APP_SECRET }}